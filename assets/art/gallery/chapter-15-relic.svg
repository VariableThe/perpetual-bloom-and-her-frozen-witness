<title id="r15-title">The First Metro — relic plate</title>
<desc id="r15-desc">Still-life relic artwork for chapter 15: The S necklace. A first metro train seen through a window, an S necklace and tiny bangles on a table with two cold coffees and a brownie.</desc>
