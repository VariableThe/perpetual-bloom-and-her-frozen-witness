<title id="r8-title">The Memory Box — relic plate</title>
<desc id="r8-desc">Still-life relic artwork for chapter 8: her memory box. An open memory box spilling a twenty-page letter, a phone, a journal and a ziplock bag onto a bed of pale petals.</desc>
